[package]
name = "goodreader"
version = "0.2.10"
description = "本地 HTML 书架与统一阅读器"
authors = ["xhl"]
edition = "2021"

[lib]
name = "goodreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0"
axum = { version = "0.7.9", features = ["json", "tokio", "http1"] }
chrono = { version = "0.4.44", features = ["serde"] }
libc = "0.2"
rand = "0.9.2"
regex = "1.12.3"
rusqlite = { version = "0.31.0", features = ["bundled", "backup"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
parking_lot = "0.12"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { version = "0.5.2", features = ["trace"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
